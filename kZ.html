
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom</title>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/FireBoxed-SF/444@main/work.png">
</head>
<body>
<script>
const source="https://cdn.jsdelivr.net/gh/FireBoxed-SF/444@main/workspace.html";
fetch(source).then(r=>{if(!r.ok)throw Error("Failed to load Loom");return r.text()}).then(html=>{
html=html.replace(/<head([^>]*)>/i,`<head$1><base href="${source.substring(0,source.lastIndexOf("/")+1)}"><link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/FireBoxed-SF/444@main/work.png"><title>Loom</title>`);
document.open();document.write(html);document.close();
}).catch(e=>document.body.textContent="Loom failed to load: "+e.message);
</script>
</body>
</html>

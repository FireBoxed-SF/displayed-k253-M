
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loom</title>
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/FireBoxed-SF/444@main/logo.png">
</head>
<body>
  <script>
    const source = "https://cdn.jsdelivr.net/gh/FireBoxed-SF/444@main/workspace.html";

    fetch(source)
      .then(response => {
        if (!response.ok) throw new Error("Failed to load Loom");
        return response.text();
      })
      .then(html => {
        html = html.replace(
          /<head([^>]*)>/i,
          `<head$1><base href="${source.substring(0, source.lastIndexOf("/") + 1)}"><link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/FireBoxed-SF/444@main/logo.png">`
        );

        document.open();
        document.write(html);
        document.close();
      })
      .catch(error => {
        document.body.textContent = "Loom failed to load: " + error.message;
      });
  </script>
</body>
</html>
